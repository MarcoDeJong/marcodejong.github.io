name: Validate deployment

on:
  deployment_status:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke-test:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.deployment_status.state == 'success' &&
      github.event.deployment.environment == 'github-pages')
    runs-on: ubuntu-latest
    env:
      SITE_URL: https://marco-dejong.nl
    steps:
      - name: Verify homepage content
        shell: bash
        run: |
          curl --fail --silent --show-error --location \
            --retry 6 --retry-delay 10 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            "$SITE_URL/" --output "$RUNNER_TEMP/homepage.html"

          grep --fixed-strings --quiet '<title>Marco de Jong</title>' "$RUNNER_TEMP/homepage.html"
          grep --fixed-strings --quiet '<link rel="canonical" href="https://marco-dejong.nl/">' "$RUNNER_TEMP/homepage.html"
          grep --fixed-strings --quiet '<h1 class="landing__title">' "$RUNNER_TEMP/homepage.html"
          grep --fixed-strings --quiet 'id="releases-title">Releases</h2>' "$RUNNER_TEMP/homepage.html"
          grep --fixed-strings --quiet 'id="about-title">Over mij</h2>' "$RUNNER_TEMP/homepage.html"
          grep --fixed-strings --quiet 'id="singers-title">' "$RUNNER_TEMP/homepage.html"
          grep --fixed-strings --quiet 'id="collaboration-title">Samenwerken</h2>' "$RUNNER_TEMP/homepage.html"
          grep --fixed-strings --quiet 'https://open.spotify.com/track/3zTm7TxioU0xLEahUA0eCQ' "$RUNNER_TEMP/homepage.html"

          # Cloudflare may replace mailto links with its email-protection URLs.
          # Decode those URLs so the live destination addresses are still checked.
          python3 - "$RUNNER_TEMP/homepage.html" <<'PY'
          import re
          import sys

          homepage = open(sys.argv[1], encoding="utf-8").read()
          addresses = set(re.findall(r"mailto:([^\"'?]+)", homepage))

          protected_values = re.findall(
              r"(?:email-protection#|data-cfemail=\")([0-9a-fA-F]+)",
              homepage,
          )
          for value in protected_values:
              encoded = bytes.fromhex(value)
              if encoded:
                  addresses.add("".join(chr(byte ^ encoded[0]) for byte in encoded[1:]))

          expected = {"demo@marco-dejong.nl", "studio@marco-dejong.nl"}
          missing = expected - addresses
          if missing:
              raise SystemExit(f"Missing email links: {', '.join(sorted(missing))}")
          PY

      - name: Verify public assets
        shell: bash
        run: |
          for asset_path in favicon.svg sitemap.xml robots.txt css/app.css; do
            curl --fail --silent --show-error --location \
              --retry 3 --retry-delay 5 --retry-all-errors \
              --connect-timeout 10 --max-time 30 \
              "$SITE_URL/$asset_path" --output /dev/null
          done

      - name: Verify redirects and missing pages
        shell: bash
        run: |
          final_url="$(curl --fail --silent --show-error --location \
            --retry 3 --retry-delay 5 --retry-all-errors \
            --connect-timeout 10 --max-time 30 \
            --output /dev/null --write-out '%{url_effective}' \
            'http://marco-dejong.nl/')"
          test "$final_url" = "$SITE_URL/"

          http_status="$(curl --silent --show-error \
            --connect-timeout 10 --max-time 30 \
            --output "$RUNNER_TEMP/not-found.html" --write-out '%{http_code}' \
            "$SITE_URL/this-page-should-not-exist-smoke-test")"
          test "$http_status" = '404'
          grep --fixed-strings --quiet 'Deze pagina bestaat niet.' "$RUNNER_TEMP/not-found.html"

          if grep --ignore-case --quiet 'http-equiv="refresh"' "$RUNNER_TEMP/not-found.html"; then
            echo 'The 404 page must not contain a meta refresh.' >&2
            exit 1
          fi
