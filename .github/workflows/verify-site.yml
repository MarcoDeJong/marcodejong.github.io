name: Verify site

on:
  push:
    branches:
      - master
  pull_request:

permissions:
  contents: read

jobs:
  build:
    # Ubuntu 26.04 only provides the latest patch release of each Ruby series.
    # Pin 24.04 so the workflow can use the exact GitHub Pages Ruby version.
    runs-on: ubuntu-24.04
    env:
      JEKYLL_GITHUB_TOKEN: ${{ github.token }}
      PAGES_REPO_NWO: ${{ github.repository }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Ruby
        uses: ruby/setup-ruby@v1
        with:
          bundler-cache: true

      - name: Check configuration
        run: bundle exec jekyll doctor

      - name: Build production site
        env:
          JEKYLL_ENV: production
        run: bundle exec jekyll build --strict_front_matter --trace

      - name: Validate generated site
        run: |
          cmp css/app.css _site/css/app.css
          bundle exec htmlproofer ./_site --disable-external
