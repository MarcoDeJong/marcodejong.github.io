# Site settings
title: Marco de Jong
email: studio@marco-dejong.nl
description: Marco de Jong · Songwriter. Tekst en muziek voor Nederlandstalige pop.
url: "https://marco-dejong.nl"
repository: MarcoDeJong/marcodejong.github.io
og_image: /img/marco-de-jong-songwriter-og.jpg
og_image_alt: Marco de Jong · Songwriter

# Build settings
markdown: kramdown
permalink: none

# Jekyll 3 replaces its default exclusions when this list is customized, so
# build-only directories must remain explicit alongside the source images.
exclude:
  - .jekyll-cache/
  - gemfiles/
  - Gemfile
  - Gemfile.lock
  - node_modules/
  - vendor/
  - img/marco-de-jong-songwriter.png
  - img/marco-de-jong-songwriter-og.png

plugins:
  - jekyll-sitemap
